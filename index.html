<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小さなアイデアからはじまる、はじめてのWebサイト。">
  <title>はじめてのWebサイト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="#">my first website<span aria-hidden="true">.</span></a>
    <a class="nav-link" href="#about">このサイトについて <span aria-hidden="true">↗</span></a>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <p class="eyebrow">HELLO, WORLD</p>
        <h1 id="hero-title">iPhoneからCodexを使ってみました</h1>
        <p class="intro">ようこそ、はじめてのWebサイトへ。<br>ここから、アイデアを少しずつ形にしていきます。</p>
        <a class="button" href="#about">もっと知る <span aria-hidden="true">↓</span></a>
      </div>
      <div class="art" aria-hidden="true">
        <div class="orbit"></div>
        <div class="sun"></div>
        <div class="hill hill-back"></div>
        <div class="hill hill-front"></div>
        <span class="art-label">A NEW BEGINNING / 001</span>
      </div>
    </section>
    <section class="about" id="about" aria-labelledby="about-title">
      <div>
        <p class="eyebrow">ABOUT THIS SITE</p>
        <h2 id="about-title">シンプルに、心地よく。</h2>
      </div>
      <p>好きなこと、作ったもの、日々の発見。<br>この場所に、あなたらしいストーリーを増やしていきましょう。</p>
    </section>
  </main>
  <footer><span>my first website.</span><span>小さくはじめて、大きく育てる。</span></footer>
</body>
</html>
